permissions:
  contents: read

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published PyPI version to repair in Homebrew (e.g. 0.1.4)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  homebrew:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version such as 0.1.4"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for PyPI availability
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/ghostcfg/${{ steps.version.outputs.version }}/json" > /dev/null; then
              echo "Package available on PyPI"
              exit 0
            fi
            echo "Waiting for PyPI... ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for PyPI"
          exit 1
      - name: Get PyPI tarball SHA256
        id: pypi
        run: |
          json=$(curl -sf "https://pypi.org/pypi/ghostcfg/${{ steps.version.outputs.version }}/json")
          url=$(echo "$json" | python3 -c "import sys,json; d=json.load(sys.stdin); print([u['url'] for u in d['urls'] if u['packagetype']=='sdist'][0])")
          sha=$(echo "$json" | python3 -c "import sys,json; d=json.load(sys.stdin); print([u['digests']['sha256'] for u in d['urls'] if u['packagetype']=='sdist'][0])")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: samkleespies/homebrew-ghostcfg
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Homebrew formula
        run: |
          cd tap
          python3 -c "
          import re
          f = 'Formula/ghostcfg.rb'
          text = open(f).read()
          # Replace only the top-level url/sha256 (before first 'resource' block)
          split = text.split('resource ', 1)
          header = split[0]
          header = re.sub(r'url \".*?\"', 'url \"${{ steps.pypi.outputs.url }}\"', header, count=1)
          header = re.sub(r'sha256 \".*?\"', 'sha256 \"${{ steps.pypi.outputs.sha256 }}\"', header, count=1)
          text = header + ('resource ' + split[1] if len(split) > 1 else '')
          # Keep unrelated packages from Homebrew's base Python out of the app.
          text = text.replace('    virtualenv_install_with_resources\\n',
                              '    virtualenv_install_with_resources system_site_packages: false\\n')
          open(f, 'w').write(text)
          "
          # Resource versions must follow the newly published package's requirements.
          # Updating only the top-level URL leaves Textual 7 pinned for Textual 8 code.
          brew tap samkleespies/ghostcfg
          tap_formula="$(brew --repository samkleespies/ghostcfg)/Formula/ghostcfg.rb"
          cp Formula/ghostcfg.rb "$tap_formula"
          brew update-python-resources samkleespies/ghostcfg/ghostcfg --install-dependencies --ignore-main-package-cooldown
          brew install --build-from-source samkleespies/ghostcfg/ghostcfg
          ghostcfg_python="$(brew --prefix ghostcfg)/libexec/bin/python"
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --python="$ghostcfg_python" check
          "$ghostcfg_python" -c "from ghostcfg.app import GhostCfg; from ghostcfg.config_io import GhosttyConfig"
          cp "$tap_formula" Formula/ghostcfg.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ghostcfg.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update ghostcfg to ${{ steps.version.outputs.version }}"
            git push
          fi
